name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Enforce pull request changelog decision
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          CHANGELOG_SKIP: "${{ contains(github.event.pull_request.labels.*.name, 'changelog: skip') }}"
          CHANGELOG_RELEASE: ${{ startsWith(github.head_ref, 'release/v') }}
        run: npm run changelog:check -- --base "origin/$BASE_REF"
